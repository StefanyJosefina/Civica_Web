<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Card Game - Civica</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/memory-game.css"/>
</head>
<body>
  <header class="main-header">
    <nav class="navbar">
      <a href="../index.html" class="logo">Civica</a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="#" id="logoutButton">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="game-container">
    <h1>Memory Card Game</h1>
    <p>Cocokkan pasangan kartu yang berkaitan dengan konsep PKWN.</p>

    <div class="game-info">
      <span id="moves">Moves: 0</span>
      <span id="timer">Time: 0s</span>
    </div>

    <div class="memory-game-grid" id="memoryGameGrid"></div>

    <div class="actions-row">
      <button id="resetGameBtn" class="btn-primary">Mulai Ulang</button>
      <button id="exitPageBtn" class="btn-exit">Keluar</button>
    </div>
  </main>

  <div id="gameResultModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" id="closeResult">&times;</button>
      <h2>🎉 Selamat!</h2>
      <p>Anda menyelesaikan permainan.</p>
      <div class="result-stats">
        <p>Total Gerakan: <span id="finalMoves">0</span></p>
        <p>Waktu: <span id="finalTime">0s</span></p>
      </div>
      <div class="modal-actions">
        <button id="playAgainBtn" class="btn-primary">Main Lagi</button>
        <button id="exitGameBtn" class="btn-exit">Keluar</button>
      </div>
    </div>
  </div>

  <footer class="main-footer">
    <p>&copy; 2025 Civica. All rights reserved.</p>
  </footer>

  <script src="../js/auth.js"></script>
  <script src="../js/memory-game.js"></script>
</body>
</html>
