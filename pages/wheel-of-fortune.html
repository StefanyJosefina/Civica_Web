<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel of Fortune - Civica</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/wheel-of-fortune.css" />
</head>
<body>
  <header class="main-header">
    <nav class="navbar">
      <a href="../index.html" class="logo">Civica</a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="#" id="logoutButton">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="wheel-card">
      <h1>Wheel of Pancasila</h1>

      <div class="wheel-area">
        <canvas id="wheelCanvas" width="420" height="420"></canvas>
        <div class="wheel-pointer">▼</div>
      </div>

      <div class="controls">
        <button id="spinButton" class="btn"> Spin </button>
        <div class="points">
          Skor: <span id="currentScore">0</span> | Tertinggi: <span id="highScore">0</span>
        </div>
      </div>

      <p class="hint">Putar roda untuk mendapatkan soal dengan poin tertentu!</p>

      <button id="exitButton" class="btn-exit">Keluar</button>
    </div>

    <div id="questionArea" class="modal hidden">
      <div class="modal-content">
        <button class="close-btn" id="closeQuestion">&times;</button>
        <h2 id="modalTitle">Pertanyaan</h2>
        <div id="questionWrap"></div>
        <div id="optionsContainer"></div>
        <div id="timerBarWrap">
          <div id="timerBar"><div></div></div>
          <span id="timerText">10s</span>
        </div>
        <div class="modal-actions">
          <button id="submitAnswer" class="btn">Submit</button>
        </div>
      </div>
    </div>

    <div id="gameModal" class="modal hidden">
      <div class="modal-content">
        <button class="close-btn" onclick="closeGameModal()">×</button>
        <h2>Game Over!</h2>
        <p id="modalMessage">Skor Anda: 0</p>
        <button class="btn" onclick="closeGameModal()">Tutup</button>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const exitButton = document.getElementById("exitButton");
      exitButton.addEventListener("click", () => {
        window.location.href = "games.html"; // ✅ arahkan ke games.html
      });
    });
  </script>

  <script src="../js/wheel-of-fortune.js"></script>
</body>
</html>
